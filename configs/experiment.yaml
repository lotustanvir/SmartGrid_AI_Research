# Q1 research experiment protocol (Phase 2, FROZEN).
# Calendar split replaces 70/15/15 ratio for Q1. Ratio keys retained only
# for legacy synthetic verification (src/training/splits.py).

protocol:
  version: "Q1_v2_LAG1_001"
  dataset: "dataset/processed/pjm_smart_grid_2020_2025_v2.csv"
  dataset_version: "v2"
  feature_version: "Q1_V2_LAG1_001"
  history_length: 168
  horizons: [1, 6, 24]
  seeds: [42, 123, 2025]
  train_end: "2024-01-01"
  val_end: "2025-01-01"
  test_end: "2026-01-01"

experiment:
  # LEGACY/synthetic-only single-run defaults (run via
  # src/training/experiment_runner.py on synthetic data). NOT Q1 headline:
  # Q1 uses horizons [1,6,24] and seeds [42,123,2025] from protocol above.
  forecast_horizon: 24
  encoder_length: 168
  seed: 42

splits:
  # LEGACY/synthetic-only (src/training/splits.py verification). NOT Q1:
  # Q1 uses calendar q1_splits below. Do not read these ratios in Q1 code.
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

q1_splits:
  train_end: "2024-01-01"
  val_end: "2025-01-01"
  test_end: "2026-01-01"

oof:
  residual_training_mode: "oof"   # oof (research) | in_sample (debug only)
  n_oof_folds: 5
